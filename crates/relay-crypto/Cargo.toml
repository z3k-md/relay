rcgen.workspace = true
relay-core.workspace = true
thiserror.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
