[package]
name = "relay-store"
description = "Content-addressed immutable object store."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
relay-core.workspace = true
blake3.workspace = true
tempfile.workspace = true
thiserror.workspace = true
walkdir.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

# Apple batch commit issues libc::fsync / fcntl(F_FULLFSYNC). Workspace
# `unsafe_code = "forbid"` cannot be relaxed on a single block.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
