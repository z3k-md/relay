[workspace]
resolver = "2"
members = [
    "crates/relay-core",
    "crates/relay-policy",
    "crates/relay-fs",
    "crates/relay-store",
    "crates/relay-db",
    "crates/relay-replica",
    "crates/relay-engine",
    "crates/relay-proto",
    "crates/relay-crypto",
    "crates/relay-net",
    "crates/relay-daemon",
    "crates/relay-ipc",
    "crates/relay-explorer",
    "crates/relay-shell-win",
    "apps/relay-cli",
    "apps/relay-sim",
    "apps/relay-vopr",
    "apps/relay-desktop/src-tauri",
]
# Plain `cargo build` / `cargo test` skip the desktop app: it needs the
# webview system libraries, a built frontend and a sidecar binary.
# See docs/DEVELOPMENT.md. CI builds everything with --workspace.
default-members = [
    "crates/relay-core",
    "crates/relay-policy",
    "crates/relay-fs",
    "crates/relay-store",
    "crates/relay-db",
    "crates/relay-replica",
    "crates/relay-engine",
    "crates/relay-proto",
    "crates/relay-crypto",
    "crates/relay-net",
    "crates/relay-daemon",
    "crates/relay-ipc",
    "crates/relay-explorer",
    "crates/relay-shell-win",
    "apps/relay-cli",
    "apps/relay-sim",
    "apps/relay-vopr",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-policy = { path = "crates/relay-policy" }
relay-fs = { path = "crates/relay-fs" }
relay-store = { path = "crates/relay-store" }
relay-db = { path = "crates/relay-db" }
relay-replica = { path = "crates/relay-replica" }
relay-engine = { path = "crates/relay-engine" }
relay-proto = { path = "crates/relay-proto" }
relay-crypto = { path = "crates/relay-crypto" }
relay-net = { path = "crates/relay-net" }
relay-daemon = { path = "crates/relay-daemon" }
relay-ipc = { path = "crates/relay-ipc" }
relay-explorer = { path = "crates/relay-explorer" }
relay-shell-win = { path = "crates/relay-shell-win" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "5"
globset = "0.4"
hex = "0.4"
if-addrs = "0.13"
interprocess = "2.2"
mdns-sd = "0.15"
notify = "8"
prost = "0.14"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
proptest = "1"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
spake2 = "0.4"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = "symbols"

# Hashing and SQLite dominate test time; keep them fast in dev builds.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
