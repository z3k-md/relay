[workspace]
resolver = "2"
members = [
    "crates/relay-core",
    "crates/relay-policy",
    "crates/relay-fs",
    "crates/relay-store",
    "crates/relay-db",
    "crates/relay-engine",
    "apps/relay-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-policy = { path = "crates/relay-policy" }
relay-fs = { path = "crates/relay-fs" }
relay-store = { path = "crates/relay-store" }
relay-db = { path = "crates/relay-db" }
relay-engine = { path = "crates/relay-engine" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
directories = "5"
globset = "0.4"
hex = "0.4"
notify = "8"
proptest = "1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
