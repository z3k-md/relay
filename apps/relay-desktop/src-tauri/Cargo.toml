[package]
name = "relay-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Realtime file sync for your machines"
authors = ["Relay"]

[lib]
# Unique from the binary name so Windows does not collide (cargo#8519).
name = "relay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
log = "0.4"
relay-core.workspace = true
relay-daemon.workspace = true
relay-engine.workspace = true
relay-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# This crate does not inherit workspace lints: Tauri 2 macros expand to
# `unsafe`, and [workspace.lints.rust] unsafe_code = "forbid" breaks them.
