# Build and publish Relay desktop + CLI on v* tags.
#
# 1. create:   a draft release (drafts are invisible to the updater)
# 2. build:    macOS universal + Windows bundles and CLI binaries into it
# 3. finalize: check latest.json covers every platform, then publish
#
# Optional public release destination (private source repo):
#   repository variable RELEASE_REPO = owner/name
#   repository secret   RELEASE_TOKEN  = PAT with contents:write on that repo
# When unset, artifacts go to this repository (GITHUB_TOKEN).
#
# The updater endpoint in apps/relay-desktop/src-tauri/tauri.conf.json is
#   https://github.com/OWNER/REPO/releases/latest/download/latest.json
# Replace OWNER/REPO with the *public* repo that hosts the assets.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Git tag to publish (e.g. v0.1.0). Leave empty to use the version
          in tauri.conf.json.
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  create:
    name: create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      repo: ${{ steps.meta.outputs.repo }}
      full: ${{ steps.meta.outputs.full }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve destination and check version
        id: meta
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          conf="apps/relay-desktop/src-tauri/tauri.conf.json"
          conf_ver=$(node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if (typeof j.version !== 'string' || !j.version) { console.error('missing top-level version'); process.exit(1); } console.log(j.version);" "$conf")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG:-v${conf_ver}}"
          else
            tag="$REF_NAME"
          fi
          if [ "${tag#v}" != "$conf_ver" ]; then
            echo "error: tag '${tag}' != tauri.conf.json version '${conf_ver}' (run scripts/release.sh)" >&2
            exit 1
          fi

          if [ -n "$RELEASE_REPO" ]; then
            case "$RELEASE_REPO" in
              */*) ;;
              *) echo "error: RELEASE_REPO must be owner/name (got: ${RELEASE_REPO})" >&2; exit 1 ;;
            esac
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo "error: vars.RELEASE_REPO is set but secret RELEASE_TOKEN is empty" >&2
              exit 1
            fi
            dest="$RELEASE_REPO"
          else
            dest="$GITHUB_REPOSITORY"
          fi
          {
            echo "tag=${tag}"
            echo "version=${conf_ver}"
            echo "owner=${dest%%/*}"
            echo "repo=${dest#*/}"
            echo "full=${dest}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} to ${dest}"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DEST: ${{ steps.meta.outputs.full }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # A separate release repo does not contain our commits, so the tag
          # there points at its default branch instead of github.sha.
          target_args=()
          if [ "$DEST" = "$GITHUB_REPOSITORY" ]; then
            target_args=(--target "$GITHUB_SHA")
          fi
          if ! gh release view "$TAG" --repo "$DEST" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$DEST" --draft \
              --title "Relay v${VERSION}" \
              --notes "Desktop app and CLI for Relay v${VERSION} (${GITHUB_SHA::7})." \
              "${target_args[@]}"
          fi
          id=$(gh api "repos/${DEST}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            echo "error: could not find release ${TAG} in ${DEST}" >&2
            exit 1
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            sidecar_target: universal-apple-darwin
            sidecar_path: apps/relay-desktop/src-tauri/binaries/relay-universal-apple-darwin
            cli_asset: relay-macos-universal
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            sidecar_target: x86_64-pc-windows-msvc
            sidecar_path: apps/relay-desktop/src-tauri/binaries/relay-x86_64-pc-windows-msvc.exe
            cli_asset: relay-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/relay-desktop/package-lock.json

      - name: Add Rust targets
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.sidecar_target }}

      - name: Install frontend dependencies
        working-directory: apps/relay-desktop
        run: npm ci

      - name: Build CLI sidecar
        run: bash apps/relay-desktop/scripts/prepare-sidecar.sh "${{ matrix.sidecar_target }}"

      - name: Build Tauri bundles into the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/relay-desktop
          releaseId: ${{ needs.create.outputs.release_id }}
          owner: ${{ needs.create.outputs.owner }}
          repo: ${{ needs.create.outputs.repo }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri_args }}

      - name: Upload CLI binary
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p cli-asset
          cp "${{ matrix.sidecar_path }}" "cli-asset/${{ matrix.cli_asset }}"
          gh release upload "${{ needs.create.outputs.tag }}" \
            "cli-asset/${{ matrix.cli_asset }}" \
            --clobber --repo "${{ needs.create.outputs.full }}"

  finalize:
    name: publish release
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DEST: ${{ needs.create.outputs.full }}
          TAG: ${{ needs.create.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$DEST" --pattern latest.json --dir . --clobber
          # The two build jobs merge into latest.json concurrently; a lost
          # update would silently strand one platform, so check before going
          # public.
          missing=$(jq -r '
            ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
            - (.platforms | keys) | join(" ")' latest.json)
          if [ -n "$missing" ]; then
            echo "error: latest.json is missing platforms: ${missing}" >&2
            echo "Re-run the failed/raced build job, then this job." >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$DEST" --draft=false --latest
          echo "Published ${TAG} to https://github.com/${DEST}/releases/tag/${TAG}"
