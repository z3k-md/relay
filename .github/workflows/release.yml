# Build and publish Relay desktop + CLI. Ordinary pushes do not run this.
# scripts/release.sh (or the workflow_dispatch API) starts it on main.
#
# 1. create:   bump the patch version unless this version is still unpublished,
#              commit it, then open a draft release (drafts are invisible to
#              the updater)
# 2. build:    macOS universal + Windows bundles and CLI binaries into it
# 3. finalize: check latest.json covers every platform, then publish
#
# Optional public release destination (private source repo):
#   repository variable RELEASE_REPO = owner/name
#   repository secret   RELEASE_TOKEN  = PAT with contents:write on that repo
# When unset, artifacts go to this repository (GITHUB_TOKEN).
#
# The updater endpoint in apps/relay-desktop/src-tauri/tauri.conf.json is
#   https://github.com/OWNER/REPO/releases/latest/download/latest.json
# Replace OWNER/REPO with the *public* repo that hosts the assets.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          patch (default) increments the build number. minor and major
          increment those components. none rebuilds the version already
          on the branch.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      version:
        description: >-
          Exact X.Y.Z to publish. Overrides bump. Leave empty to use bump.
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  create:
    name: create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}
      repo: ${{ steps.meta.outputs.repo }}
      full: ${{ steps.meta.outputs.full }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Resolve destination
        id: meta
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_REPO" ]; then
            case "$RELEASE_REPO" in
              */*) ;;
              *) echo "error: RELEASE_REPO must be owner/name (got: ${RELEASE_REPO})" >&2; exit 1 ;;
            esac
            if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
              echo "error: vars.RELEASE_REPO is set but secret RELEASE_TOKEN is empty" >&2
              exit 1
            fi
            dest="$RELEASE_REPO"
          else
            dest="$GITHUB_REPOSITORY"
          fi
          {
            echo "owner=${dest%%/*}"
            echo "repo=${dest#*/}"
            echo "full=${dest}"
          } >> "$GITHUB_OUTPUT"
          echo "Release destination: ${dest}"

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/relay-desktop/package.json

      - name: Bump version and push
        id: bump
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DEST: ${{ steps.meta.outputs.full }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$REF_NAME"
          git reset --hard "origin/${REF_NAME}"

          conf="apps/relay-desktop/src-tauri/tauri.conf.json"
          read_ver() {
            bun -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if (typeof j.version !== 'string' || !j.version) { console.error('missing top-level version'); process.exit(1); } console.log(j.version);" "$1"
          }
          current=$(read_ver "$conf")

          # A patch cut publishes the next build number only after the current
          # one is already public. A failed cut leaves a draft (or no release)
          # and the next run finishes that version instead of skipping it.
          state="missing"
          err=$(mktemp)
          if json=$(gh release view "v${current}" --repo "$DEST" --json isDraft 2>"$err"); then
            state=$(printf '%s' "$json" | jq -r .isDraft)
          elif ! grep -Eqi 'not found|HTTP 404' "$err"; then
            echo "error: could not read release v${current} in ${DEST}" >&2
            cat "$err" >&2
            exit 1
          fi
          rm -f "$err"

          kind=""
          if [ -n "$EXACT" ]; then
            kind="$EXACT"
          elif [ "$BUMP" = "none" ]; then
            kind=""
          elif [ "$BUMP" = "patch" ] && [ "$state" != "false" ]; then
            echo "v${current} is not published yet; building it without a new increment"
          else
            kind="$BUMP"
          fi

          if [ -n "$kind" ]; then
            ver=$(./scripts/release.sh --apply "$kind" | tail -n1)
            git add Cargo.toml Cargo.lock \
              apps/relay-desktop/src-tauri/tauri.conf.json \
              apps/relay-desktop/package.json
            if git diff --cached --quiet; then
              echo "version already ${ver}; not committing"
            else
              export GIT_AUTHOR_NAME="github-actions[bot]"
              export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
              export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
              export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
              git commit -m "Release v${ver}"
              git push origin "HEAD:${REF_NAME}"
            fi
          else
            ver="$current"
          fi

          conf_ver=$(read_ver "$conf")
          if [ "$ver" != "$conf_ver" ]; then
            echo "error: version '${ver}' != tauri.conf.json version '${conf_ver}'" >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          {
            echo "tag=v${ver}"
            echo "version=${ver}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing v${ver} (${sha}) to ${DEST}"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DEST: ${{ steps.meta.outputs.full }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.bump.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${DEST}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "$id" ]; then
            # The release list lags behind a create, so take the id from the
            # create response instead of looking it up again.
            args=(
              -f tag_name="$TAG"
              -f name="Relay v${VERSION}"
              -f body="Desktop app and CLI for Relay v${VERSION} (${SHA::7})."
              -F draft=true
            )
            # A separate release repo does not contain our commits, so the tag
            # there points at its default branch instead of this sha.
            if [ "$DEST" = "$GITHUB_REPOSITORY" ]; then
              args+=(-f target_commitish="$SHA")
            fi
            id=$(gh api -X POST "repos/${DEST}/releases" "${args[@]}" --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "error: could not find release ${TAG} in ${DEST}" >&2
            exit 1
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            sidecar_target: universal-apple-darwin
            sidecar_path: apps/relay-desktop/src-tauri/binaries/relay-universal-apple-darwin
            cli_asset: relay-macos-universal
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            sidecar_target: x86_64-pc-windows-msvc
            sidecar_path: apps/relay-desktop/src-tauri/binaries/relay-x86_64-pc-windows-msvc.exe
            cli_asset: relay-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.create.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/relay-desktop/package.json

      - name: Add Rust targets
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.sidecar_target }}
          # Dispatched on main so later releases reuse this cache. A cache
          # saved from a tag is visible only to that tag.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install frontend dependencies
        working-directory: apps/relay-desktop
        run: bun install --frozen-lockfile

      - name: Build CLI sidecar
        run: bash apps/relay-desktop/scripts/prepare-sidecar.sh "${{ matrix.sidecar_target }}"

      - name: Build Tauri bundles into the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/relay-desktop
          releaseId: ${{ needs.create.outputs.release_id }}
          owner: ${{ needs.create.outputs.owner }}
          repo: ${{ needs.create.outputs.repo }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri_args }}

      - name: Upload CLI binary
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p cli-asset
          cp "${{ matrix.sidecar_path }}" "cli-asset/${{ matrix.cli_asset }}"
          gh release upload "${{ needs.create.outputs.tag }}" \
            "cli-asset/${{ matrix.cli_asset }}" \
            --clobber --repo "${{ needs.create.outputs.full }}"

  finalize:
    name: publish release
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DEST: ${{ needs.create.outputs.full }}
          TAG: ${{ needs.create.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$DEST" --pattern latest.json --dir . --clobber
          # The two build jobs merge into latest.json concurrently; a lost
          # update would silently strand one platform, so check before going
          # public.
          missing=$(jq -r '
            ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]
            - (.platforms | keys) | join(" ")' latest.json)
          if [ -n "$missing" ]; then
            echo "error: latest.json is missing platforms: ${missing}" >&2
            echo "Re-run the failed/raced build job, then this job." >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$DEST" --draft=false --latest
          echo "Published ${TAG} to https://github.com/${DEST}/releases/tag/${TAG}"
