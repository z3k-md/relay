# CI for the Relay workspace (Rust crates + Tauri desktop crate).
#
# Linux lints and tests everything except the desktop crate (Linux desktop
# builds are not shipped, so it skips the webkit/gtk system packages) and
# typechecks/builds the frontend. macOS and Windows lint the desktop crate
# against a placeholder frontend. relay-desktop has no tests, so every OS runs
# nextest without it.
#
# The deterministic simulator (apps/relay-vopr) is tiered so the per-push
# cost stays small:
#   - every push, every OS: unit tests only;
#   - every pull request, Linux: a sim smoke (one seed, 200 steps, ~20 s);
#   - pull requests that touch the engine crates, or carry the `ci:full-sim`
#     label: the full sim suite on Linux (`sim-full`, ~2 min);
#   - pushes to main: the full sim suite on Linux;
#   - nightly (sim-nightly.yml): the full suite on every OS plus a wide seed
#     sweep in release mode.
# Pushes to main also prune older Actions caches so the repo stays under the
# 10 GB cache limit (rust-cache saves a new entry per Cargo.lock hash).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
    # `labeled` so adding `ci:full-sim` re-runs with the full suite.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Panics keep file:line; full debuginfo mostly costs link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which optional tiers this pull request needs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did the engine change?
        id: diff
        run: |
          base="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)"
          if git diff --name-only "$base" HEAD \
            | grep -Eq '^(crates/relay-(engine|core|fs|store|db|proto|crypto)/|apps/relay-vopr/|Cargo\.(toml|lock)$)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A normal run takes well under this; a hang should fail, not burn 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lint: true
          - os: macos-latest
            desktop: true
          - os: windows-latest
            desktop: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ReFS dev drive: much faster builds and file-heavy tests than C:, which
      # Defender scans synchronously. Every later step runs from the copy.
      - name: Set up Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 12GB
          workspace-copy: true
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      - name: Create temp dir on Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null

      - name: Install pinned Rust toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          # rust-toolchain.toml is honoured by rustup (channel + rustfmt/clippy).
          rustup show
          rustup component add rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }} -> target
          # PR runs restore main's cache but do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: rustfmt
        if: matrix.lint
        run: cargo fmt --all --check

      - name: clippy
        if: matrix.lint
        run: cargo clippy --workspace --exclude relay-desktop --all-targets --locked -- -D warnings

      - name: Setup Bun
        if: matrix.lint
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/relay-desktop/package.json

      - name: Typecheck and build desktop frontend
        if: matrix.lint
        working-directory: apps/relay-desktop
        run: |
          bun install --frozen-lockfile
          bun run frontend:build

      - name: Placeholder frontend and sidecar for tauri-build
        if: matrix.desktop
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          set -euo pipefail
          # generate_context! only needs frontendDist to exist; the real
          # frontend is built on Linux. tauri-build checks that
          # bundle.externalBin exists at compile time.
          mkdir -p apps/relay-desktop/dist
          printf '<!doctype html><title>Relay</title>\n' > apps/relay-desktop/dist/index.html
          triple=$(rustc -vV | sed -n 's/host: //p')
          dest="apps/relay-desktop/src-tauri/binaries/relay-${triple}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="${dest}.exe"
          fi
          mkdir -p "$(dirname "$dest")"
          printf 'placeholder' > "$dest"

      - name: clippy (desktop)
        if: matrix.desktop
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo clippy -p relay-desktop --all-targets --locked -- -D warnings

      - name: test (unit)
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo nextest run --workspace --exclude relay-desktop --exclude relay-vopr --locked --no-fail-fast

      # One seed and short runs: enough to catch a broken engine seam. The
      # full suite runs in `sim-full` when the engine changed, and nightly.
      - name: test (sim smoke)
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          RELAY_VOPR_SEEDS: "1"
          RELAY_VOPR_STEPS: "200"
        run: cargo nextest run -p relay-vopr --locked --no-fail-fast

      - name: test (sim full)
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: cargo nextest run -p relay-vopr --locked --no-fail-fast

  # Full simulator suite for pull requests that touch the engine or ask for
  # it with the `ci:full-sim` label. Linux only; macOS and Windows run it
  # nightly, since the OS-specific parts are filesystem semantics that do not
  # change often.
  sim-full:
    name: sim full (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.engine == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'ci:full-sim'))
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Restore the `rust` job's main cache; never save one of our own.
          shared-key: rust
          save-if: false

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Full simulator suite
        run: cargo nextest run -p relay-vopr --locked --no-fail-fast

  # rust-cache keys each entry by the Cargo.lock hash, so every lockfile
  # change on main leaves the previous entry behind until GitHub evicts it.
  # Keep the newest entry per key prefix (one per OS, one per release
  # target) and delete the rest.
  prune-caches:
    name: prune caches
    runs-on: ubuntu-latest
    needs: rust
    if: always() && github.event_name == 'push'
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --limit 500 \
            --json id,key,createdAt,sizeInBytes > caches.json
          python3 - <<'EOF'
          import json, os, re, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          groups = {}
          for cache in json.load(open("caches.json")):
              # v0-rust-<job>-<OS>-<arch>-<env hash>-<lockfile hash>
              prefix = re.sub(r"-[0-9a-f]{8}$", "", cache["key"])
              groups.setdefault(prefix, []).append(cache)
          freed = 0
          for prefix, caches in groups.items():
              caches.sort(key=lambda c: c["createdAt"], reverse=True)
              for cache in caches[1:]:
                  size = cache["sizeInBytes"] // 1048576
                  print(f"delete {cache['key']} ({size} MB)")
                  subprocess.run(
                      ["gh", "cache", "delete", str(cache["id"]), "-R", repo],
                      check=False,
                  )
                  freed += size
          print(f"freed about {freed} MB")
          EOF
