# CI for the Relay workspace (Rust crates + Tauri desktop crate).
#
# Linux lints and tests everything except the desktop crate (Linux desktop
# builds are not shipped, so it skips the webkit/gtk system packages). macOS
# and Windows build the frontend and lint the desktop crate. relay-desktop has
# no tests, so every OS runs nextest without it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Panics keep file:line; full debuginfo mostly costs link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lint: true
          - os: macos-latest
            desktop: true
          - os: windows-latest
            desktop: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ReFS dev drive: much faster builds and file-heavy tests than C:, which
      # Defender scans synchronously. Every later step runs from the copy.
      - name: Set up Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 12GB
          workspace-copy: true
          env-mapping: |
            TMP,{{ DEV_DRIVE }}/tmp
            TEMP,{{ DEV_DRIVE }}/tmp

      - name: Create temp dir on Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TMP | Out-Null

      - name: Install pinned Rust toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          # rust-toolchain.toml is honoured by rustup (channel + rustfmt/clippy).
          rustup show
          rustup component add rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }} -> target
          # PR runs restore main's cache but do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: rustfmt
        if: matrix.lint
        run: cargo fmt --all --check

      - name: clippy
        if: matrix.lint
        run: cargo clippy --workspace --exclude relay-desktop --all-targets --locked -- -D warnings

      - name: Setup Node.js
        if: matrix.desktop
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/relay-desktop/package-lock.json

      - name: Build desktop frontend
        if: matrix.desktop
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/apps/relay-desktop
        run: |
          npm ci
          npm run build

      - name: Placeholder sidecar for tauri-build
        if: matrix.desktop
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          set -euo pipefail
          # tauri-build checks bundle.externalBin exists at compile time.
          triple=$(rustc -vV | sed -n 's/host: //p')
          dest="apps/relay-desktop/src-tauri/binaries/relay-${triple}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="${dest}.exe"
          fi
          mkdir -p "$(dirname "$dest")"
          printf 'placeholder' > "$dest"

      - name: clippy (desktop)
        if: matrix.desktop
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo clippy -p relay-desktop --all-targets --locked -- -D warnings

      - name: test
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo nextest run --workspace --exclude relay-desktop --locked --no-fail-fast
