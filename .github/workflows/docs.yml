# Doc consistency: links resolve, cited decision numbers exist, DESIGN §
# references point at real sections, and the DECISIONS.md index is current.
# Runs on every change (code comments cite D-numbers too). Seconds, no build.
name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    name: check-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-docs.py
